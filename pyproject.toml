[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "founder-radar"
version = "2.0.0"
description = "UK Founder Radar — daily scan for early-stage UK startups, routed to four VC funds"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  # Imported directly by config/loader.py. Pydantic happens to require it, but
  # a direct import satisfied only transitively breaks the day that changes.
  "annotated-types>=0.6",
  "click>=8.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "rapidfuzz>=3.9,<4",
  "protego>=0.3",
  "tldextract>=5.1",
  # The HTML and RSS parsers behind every adapter. `html_doc` turns a missing
  # parser into `LayoutChanged`, which reads as "the website changed" — so an
  # undeclared parser looks like eleven broken sources, not one missing wheel.
  "selectolax>=0.3,<1",
  "feedparser>=6.0,<7",
  "gspread>=6.1,<7",
  "google-auth>=2.30",
  "python-dateutil>=2.9",
  "python-ulid>=2.7",
]

[project.optional-dependencies]
extract = ["trafilatura>=1.12", "anthropic>=0.40"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
founder-radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["store/*.sql", "store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The bare `pytest` is the offline 60-second suite (09-test-plan.md §0). A
# later `-m` on the command line wins, so `pytest -m integration` still works.
addopts = "-q --strict-markers -m 'not integration and not perf and not live and not llm and not eval'"
markers = [
  "eval: opt-in evaluation tests that may call the network (deselected by default)",
  "integration: needs a scratch spreadsheet and a Companies House key; not in CI",
  "perf: performance targets; sits outside the 60-second offline budget (NFR-4)",
  "live: hits real source websites; run weekly, not in CI (09-test-plan.md §4)",
  "llm: opt-in, calls a real provider and costs pence; run before releases",
]
