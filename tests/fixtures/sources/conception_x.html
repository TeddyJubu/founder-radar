<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Portfolio | Conception X</title>
  <meta name="description" content="PhD deeptech ventures built at or before incorporation." />
</head>
<body>
  <header class="nav"><a href="/">Conception X</a><a href="/programme">Programme</a></header>
  <main>
    <h1>Our ventures</h1>

    <!--
      The live layout, abridged (fetched 9 August 2026). Two things here are
      load-bearing and must not be "tidied":

      1. The cohort filter radios below are also `.w-dyn-item`. That is why the
         adapter selects `.portfolio-collection-item` first — the loose Webflow
         class matches filters and ventures alike, and the filters carry no
         name, so the parser returned 42 cards and zero companies while every
         guard stayed green.
      2. There are no heading tags. The venture name is a `.para-xxl-24` div
         inside `.portfolio-title-wrap`, which is why h2/h3/h4 find nothing.
    -->

    <div class="filters w-dyn-list">
      <div role="list" class="w-dyn-items">
        <div role="listitem" class="w-dyn-item">
          <label class="filter-radio-item w-radio">
            <input fs-list-value="CX23" fs-list-field="cohort" type="radio" />
            <span class="filter-text w-form-label">CX23</span>
          </label>
        </div>
        <div role="listitem" class="w-dyn-item">
          <label class="filter-radio-item w-radio">
            <input fs-list-value="CX24" fs-list-field="cohort" type="radio" />
            <span class="filter-text w-form-label">CX24</span>
          </label>
        </div>
      </div>
    </div>

    <div class="portfolio-collection w-dyn-list">
      <div role="list" class="w-dyn-items">

        <div role="listitem" class="portfolio-collection-item w-dyn-item">
          <div class="portfolio-card-wrap">
            <div class="portfolio-default">
              <div class="portfolio-def-info">
                <div class="portfolio-title-wrap">
                  <div class="para-xxl-24">Astra Materials</div>
                </div>
                <div class="portfolio-def-details">
                  <div class="portfolio-def-credits">
                    <div class="label-s-14 medium t-gray04">Founded By</div>
                    <div class="label-s-14">A. Researcher</div>
                  </div>
                  <div class="portfolio-def-credits">
                    <div class="label-s-14 medium t-gray04">Cohort</div>
                    <div class="portfolio-def-cohort">
                      <div fs-list-field="cohort" class="label-s-14">CX24</div>
                    </div>
                  </div>
                  <div fs-list-field="sector" class="label-s-14 medium t-gray04">Advanced Materials</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div role="listitem" class="portfolio-collection-item w-dyn-item">
          <div class="portfolio-card-wrap">
            <div class="portfolio-default">
              <div class="portfolio-def-info">
                <div class="portfolio-title-wrap">
                  <div class="para-xxl-24">Brackish Robotics</div>
                </div>
                <div class="portfolio-def-details">
                  <div class="portfolio-def-credits">
                    <div class="label-s-14 medium t-gray04">Cohort</div>
                    <div class="portfolio-def-cohort">
                      <div fs-list-field="cohort" class="label-s-14">CX23</div>
                    </div>
                  </div>
                  <div fs-list-field="sector" class="label-s-14 medium t-gray04">Robotics</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div role="listitem" class="portfolio-collection-item w-dyn-item">
          <div class="portfolio-card-wrap">
            <div class="portfolio-default">
              <div class="portfolio-def-info">
                <div class="portfolio-title-wrap">
                  <div class="para-xxl-24">Cadence Bio</div>
                </div>
                <div class="portfolio-def-details">
                  <div class="portfolio-def-credits">
                    <div class="label-s-14 medium t-gray04">Cohort</div>
                    <div class="portfolio-def-cohort">
                      <div fs-list-field="cohort" class="label-s-14">CX25</div>
                    </div>
                  </div>
                  <div fs-list-field="sector" class="label-s-14 medium t-gray04">Life Sciences</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div role="listitem" class="portfolio-collection-item w-dyn-item">
          <div class="portfolio-card-wrap">
            <div class="portfolio-default">
              <div class="portfolio-def-info">
                <div class="portfolio-title-wrap">
                  <div class="para-xxl-24">Dover Photonics</div>
                </div>
                <div class="portfolio-def-details">
                  <div class="portfolio-def-credits">
                    <div class="label-s-14 medium t-gray04">Cohort</div>
                    <div class="portfolio-def-cohort">
                      <div fs-list-field="cohort" class="label-s-14">CX25</div>
                    </div>
                  </div>
                  <div fs-list-field="sector" class="label-s-14 medium t-gray04">Photonics</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!--APPEND-VENTURE-HERE-->
      </div>
    </div>
  </main>
  <footer class="footer"><p>&copy; 2026 Conception X</p></footer>
</body>
</html>
