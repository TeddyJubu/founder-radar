name: founder-radar-telegram
version: 1.1.0
description: >
  Telegram search/today always start founder-radar and reply with the Today
  dashboard URL. Bypasses the LLM so company lists never land in chat.
  /focus, /clearfocus and /schedule set the fund focus and weekly rotation.
author: founder-radar
provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - pre_tool_call
  - transform_llm_output
