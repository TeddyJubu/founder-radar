name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, because it needs nothing installed. A pull request that
      # reintroduces token_set_ratio or `sub_score or 0` goes red in seconds
      # rather than after the whole suite has been provisioned
      # (09-test-plan §8, 10-build-plan rule 3).
      - name: Guards — banned fuzzy scorers, None coerced to zero
        run: bash scripts/ci-guards.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      # Also covered by the full suite below, but named as its own gate: these
      # are the checks that keep dates of birth and correspondence addresses
      # out of the database, and the service-account key out of git. A red
      # cross that says "Privacy" is worth more than one that says "tests".
      - name: Privacy — no personal-data columns, no tracked secrets
        run: python -m pytest tests/unit/test_schema_privacy.py tests/unit/test_privacy.py

      # `addopts` in pyproject.toml already deselects the integration, perf,
      # live and llm markers, so a bare `pytest` is exactly the offline suite:
      # no network, no credentials. Restating the filter here would let the two
      # drift apart.
      - name: Offline suite
        run: python -m pytest
