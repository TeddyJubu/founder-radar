name: Deploy

# Optional GitHub-side deploy. Production auto-ship is on the VPS:
# founder-radar-update.timer runs deploy/update-from-main.sh every few
# minutes, so a merge to main reaches /opt/founder-radar without repository
# secrets (I23/J26).
#
# This workflow stays as a second door: workflow_dispatch, or a push to
# main IF VPS_HOST / VPS_USER / VPS_SSH_KEY are set. Missing secrets skip
# with success so the Actions tab does not show a red X. When secrets exist
# the remote command is the same script the timer runs (flock serialises).
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     - hostname or IP of the VPS (e.g. srv1821489.hstgr.cloud)
#   VPS_USER     - SSH user with sudo (deploy/install.sh needs root)
#   VPS_SSH_KEY  - a private SSH key whose public half is in authorized_keys
#   VPS_PORT     - SSH port (default 22)
#
# The production layout is fixed at /opt/founder-radar.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Force rescore --all even when HEAD is already current"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Skip when VPS GitHub secrets are not configured
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "VPS GitHub secrets are not set."
            echo "Production ships via founder-radar-update.timer on the box"
            echo "(deploy/update-from-main.sh). This job is a no-op."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy main to the VPS
        if: steps.secrets.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RESCORE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.rescore_all }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          port="${VPS_PORT:-22}"
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy -p "$port" -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n env RADAR_UPDATE_FORCE_RESCORE='$RESCORE_ALL' bash /opt/founder-radar/app/deploy/update-from-main.sh"
          echo "Deploy finished. Also spot-check /api/today on the host."
