openapi: 3.1.0
info:
  title: UK Founder Radar — ChatGPT Actions
  version: "1.1.0"
  description: |
    Authenticated product-ops API for the UK Founder Radar Custom GPT.
    Wraps allowlisted `founder-radar` CLI commands only.

    Hard rules for the GPT:
    - Never invent Fit/Edge scores or company lists — return CLI output only.
    - For today / search, prefer the dashboard URL over dumping companies into chat.
    - Poll until done, partial, failed, or interrupted; only done is full success.
    - Supply a stable Idempotency-Key for every async operation and its retries.
    - Never replay an interrupted operation automatically or publish after partial search.
    - Search already writes SQLite and syncs the Google Sheet.
    - Out of scope: systemd, deploy, git, `.env` edits, `forget`, `db restore`.
servers:
  - url: https://actions.srv1821489.hstgr.cloud
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: Liveness (no auth)
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
  /v1/today:
    get:
      operationId: today
      summary: Today dashboard ping (counts + URL, no company dump)
      responses:
        "200":
          description: CLI today output plus dashboard_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
  /v1/status:
    get:
      operationId: status
      summary: Pipeline / DB status
      responses:
        "200":
          description: Status report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
  /v1/doctor:
    get:
      operationId: doctor
      summary: Operator doctor checks
      responses:
        "200":
          description: Doctor checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
  /v1/why-today:
    get:
      operationId: whyToday
      summary: Explain empty or thin Today list (counts only)
      responses:
        "200":
          description: Diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
  /v1/companies/{name}:
    get:
      operationId: showCompany
      summary: Full record for one company (founder-radar show)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Company show output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
  /v1/funds/{key}:
    get:
      operationId: fundTop
      summary: Top matches for one fund
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum: [northstar, dsw, outward, anticus]
        - name: top
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Fund top list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
  /v1/decide:
    post:
      operationId: decide
      summary: Record lasting verdict (worth contacting | not for me | unsure)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, verdict]
              properties:
                name:
                  type: string
                  maxLength: 200
                verdict:
                  type: string
                  enum:
                    - worth contacting
                    - not for me
                    - unsure
      responses:
        "200":
          description: Verdict recorded (or ambiguous name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/JobConflict"

  /v1/publish-check:
    post:
      operationId: publishCheck
      summary: Pre-publish gate (Hermes + deterministic)
      responses:
        "200":
          description: Gate report (ok or blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/JobConflict"

  /v1/publish:
    post:
      operationId: publish
      summary: Legacy synchronous publish; prefer startPublish for retry-safe automation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                send:
                  type: boolean
                  default: false
                  description: Strict JSON boolean. When true, push the dashboard ping only if the CLI publish gate passes
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/JobConflict"

  /v1/today-qa:
    post:
      operationId: todayQa
      summary: Re-run Today QA veto (does not rewrite scores)
      responses:
        "200":
          description: QA summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/JobConflict"

  /v1/jobs/search:
    post:
      operationId: startSearch
      summary: Start an async scan (poll /v1/jobs/{id}; prefer dashboard URL)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fund:
                  type: string
                  enum: [northstar, dsw, outward, anticus]
                source:
                  type: string
                since:
                  type: string
                fund_key:
                  type: string
                  description: Alias of fund; when both are present they must agree
                source_key:
                  type: string
                  description: Alias of source; when both are present they must agree
                no_llm:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "200":
          $ref: "#/components/responses/JobReused"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/JobConflict"
        "503":
          $ref: "#/components/responses/JobStoreUnavailable"

  /v1/jobs/rescore:
    post:
      operationId: startRescore
      summary: Start an async rescore (optional --all)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                all:
                  type: boolean
                  default: false
                  description: Pass --all to founder-radar rescore
                all_companies:
                  type: boolean
                  description: Alias of all; when both are present they must agree
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "200":
          $ref: "#/components/responses/JobReused"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/JobConflict"
        "503":
          $ref: "#/components/responses/JobStoreUnavailable"

  /v1/jobs/publish:
    post:
      operationId: startPublish
      summary: Async existing CLI publish gate and Today QA; Telegram send defaults false
      description: No flags bypass the CLI gate. May update SQLite/Sheet even when send is false.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                send:
                  type: boolean
                  default: false
                  description: Strict JSON boolean; strings, numbers, and null are rejected
      responses:
        "202":
          description: New job accepted or existing active job reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "200":
          $ref: "#/components/responses/JobReused"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/JobConflict"
        "503":
          $ref: "#/components/responses/JobStoreUnavailable"
  /v1/jobs/{id}:
    get:
      operationId: jobStatus
      summary: Poll until done, partial, failed, or interrupted
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{32}$"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  job:
                    $ref: "#/components/schemas/Job"
        "404":
          description: Unknown job id
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Required for retry-safe automation. Reuse the same key for retries of
        one normalized operation. Different commands/arguments with the same
        key return 409. Omitted keys retain legacy fresh-job behavior.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  responses:
    JobReused:
      description: Existing terminal job reused; poll its result, never start a new key automatically
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobAccepted"
    BadRequest:
      description: Invalid parameters; boolean strings/numbers/null, conflicting aliases, and unknown fields are rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    JobConflict:
      description: idempotency_conflict or mutation_in_progress; a busy rejection does not create a job
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    JobStoreUnavailable:
      description: Stored state is unreadable; fail closed and request operator review
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Value of RADAR_CHATGPT_API_KEY from the VPS
        `/opt/founder-radar/.env`. Header name Authorization,
        value `Bearer <key>`.
  schemas:
    ApiError:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
        job_id:
          type: string
          description: Active job id when known for mutation_in_progress
        poll:
          type: string
    CliResult:
      type: object
      properties:
        ok:
          type: boolean
        exit_code:
          type: integer
        argv:
          type: array
          items:
            type: string
        stdout:
          type: string
        stderr:
          type: string
        result:
          description: Parsed JSON from CLI stdout when available
        dashboard_url:
          type: string
          nullable: true
        hint:
          type: string
    JobAccepted:
      type: object
      properties:
        ok:
          type: boolean
        accepted:
          type: boolean
        reused:
          type: boolean
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, done, partial, failed, interrupted]
        dashboard_url:
          type: string
          nullable: true
        poll:
          type: string
        hint:
          type: string
    Job:
      type: object
      description: Outer ok reports request success; job.status and exit_code report command outcome. Search exit 1 is partial; interrupted jobs are never replayed.
      properties:
        id:
          type: string
        command:
          type: string
        status:
          type: string
          enum: [queued, running, done, partial, failed, interrupted]
        created_at:
          type: number
        updated_at:
          type: number
        dashboard_url:
          type: string
          nullable: true
        exit_code:
          type: integer
          nullable: true
        stdout:
          type: string
        stderr:
          type: string
        error:
          type: string
          nullable: true
        message:
          type: string
        result:
          description: Parsed CLI stdout JSON when available; absent for non-JSON output. The CLI exit code remains authoritative.
        meta:
          type: object
          additionalProperties: true
