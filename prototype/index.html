<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Today — UK Founder Radar</title>
<link rel="stylesheet" href="/tokens.css" />
<style>
/* ─────────────────────────────────────────────────────────── shell */

.app {
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-width: 880px;
  margin: 0 auto;
  padding: 0 var(--s5);
}

header {
  display: flex; align-items: baseline; gap: var(--s3);
  padding: var(--s7) 0 var(--s5);
}
h1 {
  font-size: var(--large-title); line-height: var(--large-title-lh);
  font-weight: 700; letter-spacing: -0.4px; margin: 0;
}
.date {
  font-size: var(--subhead); color: var(--label-2); margin-right: auto;
  white-space: nowrap;      /* "Monday / 10 / August" over three lines, once */
}

/* One quiet way out to the explanation. It sits before the dots so it is
   never mistaken for progress. */
.help {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--fill); color: var(--label-2);
  font-size: var(--footnote); font-weight: 600; text-decoration: none;
  transition: background .2s var(--spring), color .2s var(--spring);
}
.help:hover { background: color-mix(in srgb, var(--blue) 16%, var(--fill)); color: var(--blue); }
.help:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
/* `.help` is a 24px circle for the single "?" glyph; word links need to
   grow to their content instead of letting the label overflow into the next
   control. */
.dashboard-link,
.kept-link {
  width: auto; border-radius: 999px; padding: 0 11px;
  gap: 6px; display: inline-flex; align-items: center;
}
.kept-badge {
  min-width: 1.1em; padding: 0 5px; height: 16px;
  border-radius: 999px;
  background: var(--blue-fill); color: #fff;
  font-size: 11px; line-height: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums; text-align: center;
}
.kept-badge:empty, .kept-badge[data-count="0"] { display: none; }

/* Progress: dots, not "2 of 6". A count invites counting; dots are glanceable. */
.dots { display: flex; gap: 6px; align-items: center; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--label-3);
  transition: background .3s var(--spring), transform .3s var(--spring);
}
.dot.done { background: var(--label-2); }
.dot.now  { background: var(--blue); transform: scale(1.45); }

/* ─────────────────────────────────────────────────────────── card */

/* Room for the sticky verdict bar: the explanation is the point of the
   card and must never sit behind it. */
main {
  display: flex; flex-direction: column; align-items: flex-start;
  padding-bottom: var(--s5);
}

/* Queue diagnostics are aggregate-only: useful for correcting the pipeline
   without turning the Today page into a second company directory. */
.diagnostics {
  width: 100%; box-sizing: border-box;
  margin-bottom: var(--s4); padding: var(--s4);
  border: 0.5px solid color-mix(in srgb, var(--blue) 22%, var(--separator));
  border-radius: var(--r-card);
  background: color-mix(in srgb, var(--blue) 5%, var(--bg-3));
  animation: rise .32s var(--spring) both;
}
.diagnostics-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s3);
}
.diagnostics-kicker {
  margin: 0 0 3px; color: var(--blue);
  font-size: var(--caption); line-height: var(--caption-lh);
  font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
}
.diagnostics h2 {
  margin: 0; font-size: var(--headline); line-height: var(--headline-lh);
  font-weight: 600; letter-spacing: -.15px;
}
.diagnostics-total {
  flex: none; color: var(--label-2);
  font-size: var(--subhead); line-height: var(--subhead-lh);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.diagnostics-summary {
  margin: var(--s2) 0 0; color: var(--label-2);
  font-size: var(--footnote); line-height: var(--footnote-lh);
}
.diagnostics-reasons {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 6px var(--s3); margin: var(--s3) 0 0; padding: 0;
  list-style: none;
}
.diagnostic-reason {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s2); padding-top: 6px;
  border-top: 0.5px solid var(--separator);
  font-size: var(--footnote); line-height: var(--footnote-lh);
}
.diagnostic-label { color: var(--label-2); }
.diagnostic-count {
  color: var(--label); font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.card {
  width: 100%;
  background: var(--bg-3);
  border-radius: var(--r-card);
  padding: var(--s6);
  border: 0.5px solid var(--separator);
  animation: rise .42s var(--spring) both;
}
/* Scan path, not chrome: what the company is, which funds match, who to
   send it to, then why it matches / what's missing / why it's new. Numbers
   still come from the API; this only rearranges them. */
@keyframes rise {
  from { opacity: 0; transform: translateY(10px) scale(0.995); }
  to   { opacity: 1; transform: none; }
}

/* Coverage below the floor tints the whole card. `min_coverage` made visible
   instead of silently suppressing a shortlist. */
.card.thin {
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--orange) 5%, var(--bg-3)) 0%, var(--bg-3) 190px);
}

/* What it is (left) and which funds match (right). Stacks on a phone. */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(220px, 0.9fr);
  gap: var(--s5);
  align-items: start;
}
.ident { min-width: 0; }
.ident-head {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 2px var(--s3);
  align-items: start;
}
.mark {
  grid-row: 1 / span 2;
  width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--blue-fill); color: #fff;
  font-size: 17px; line-height: 1; font-weight: 700;
  letter-spacing: -0.3px;
}
.card h2 {
  grid-column: 2;
  font-size: 28px; line-height: 32px;
  font-weight: 700; letter-spacing: -0.4px; margin: 0;
  overflow-wrap: anywhere;
}
.meta {
  grid-column: 2;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  color: var(--label-2);
  display: flex; flex-wrap: wrap; gap: var(--s2) 0;
}
.meta > * + *::before { content: "·"; margin: 0 var(--s2); color: var(--label-3); }
.meta a { color: var(--blue); text-decoration: none; }
.meta a:hover { text-decoration: underline; }
.age { color: var(--label); font-weight: 500; }
.ch-verified {
  display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px;
  width: fit-content; margin-top: var(--s3); padding: 5px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--green) 12%, transparent);
  color: var(--green); border: 0.5px solid color-mix(in srgb, var(--green) 28%, transparent);
  font-size: var(--footnote); line-height: var(--footnote-lh); font-weight: 590;
}
.ch-verified-date { color: var(--label-2); font-weight: 500; }

/* Match is the primary number (fund criteria strength). Fresh is secondary —
   younger / less covered / register-first. Testids stay score-fit / score-edge
   so the API contract does not churn. */
.scores {
  display: flex; flex-direction: column; align-items: stretch;
  gap: var(--s3); min-width: 0;
}
.score-row { display: flex; gap: var(--s2); }
.score {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: stretch;
  gap: 4px;
  padding: 10px 10px 8px;
  background: var(--fill); border-radius: var(--r-control);
}
.score-fit {
  background: color-mix(in srgb, var(--blue) 8%, var(--fill));
  border: 0.5px solid color-mix(in srgb, var(--blue) 18%, transparent);
}
.score-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s2);
}
.score .n {
  font-size: 22px; line-height: 26px; font-weight: 600;
  letter-spacing: -0.4px; font-variant-numeric: tabular-nums;
}
.score .k {
  font-size: var(--caption); line-height: var(--caption-lh);
  color: var(--label-2); text-transform: uppercase; letter-spacing: 0.4px;
}
.score-def {
  margin: 0;
  font-size: var(--caption); line-height: var(--caption-lh);
  color: var(--label-2);
}
.score-factors {
  list-style: none; margin: 4px 0 0; padding: 0;
}
.score-factor {
  display: grid;
  grid-template-columns: minmax(4.5rem, 0.9fr) minmax(0, 1.2fr);
  gap: 4px var(--s2);
  align-items: baseline;
  padding: 4px 0 0;
  border-top: 0.5px solid var(--separator);
  margin-top: 4px;
  font-size: var(--caption); line-height: 16px;
  color: var(--label);
}
.score-factor .sf-val {
  color: var(--label-2); text-align: right;
  min-width: 0;
}
.score-factor[data-status="missed"] .sf-val { color: var(--red); }
.score-hint {
  font-size: var(--caption); line-height: var(--caption-lh);
  color: var(--label-3);
}
.fund-scores {
  width: 100%;
  display: flex; flex-direction: column; gap: 8px;
}
.fund-scores-head h3 {
  margin: 0;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  font-weight: 590; color: var(--label);
}
.fund-scores-hint {
  margin: 3px 0 2px;
  font-size: var(--caption); line-height: var(--caption-lh);
  color: var(--label-2);
}
.fund-score {
  min-width: 0; padding: 8px 10px 10px;
  background: var(--fill); border: 0.5px solid var(--separator);
  border-radius: var(--r-control);
}
.fund-score.best {
  background: color-mix(in srgb, var(--blue) 8%, var(--fill));
  border-color: color-mix(in srgb, var(--blue) 22%, transparent);
}
.fund-score-top {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s2);
}
.fund-score-name {
  min-width: 0;
  display: flex; align-items: baseline; gap: 8px;
}
.fund-score .n {
  flex: none;
  font-size: 15px; line-height: 20px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.fund-score .k {
  min-width: 0;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  color: var(--label); font-weight: 510;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fund-bar {
  margin-top: 6px; height: 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--label) 12%, transparent);
  overflow: hidden;
}
.fund-bar-fill {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--blue-fill), var(--purple));
}
.fund-score[data-tier="reject"] .fund-bar-fill,
.fund-score[data-tier="unscored"] .fund-bar-fill {
  background: var(--label-3);
}
.fund-note {
  margin: 2px 0 0;
  font-size: var(--caption); line-height: var(--caption-lh);
  color: var(--label-3);
}
.fund-note strong { color: var(--label); font-weight: 500; }
.fund-why {
  margin: 5px 0 0;
  font-size: var(--caption); line-height: var(--caption-lh);
  color: var(--label-2);
}
.fund-tag {
  flex: none;
  font-size: 10px; line-height: 14px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--blue);
}
.fund-score.high .n { color: var(--green); }
.fund-score.mid .n { color: var(--label); }
.fund-score.low .n { color: var(--orange); }
.fund-score[data-tier="reject"] .n,
.fund-score[data-tier="unscored"] .n { color: var(--label-3); }
.score.high .n { color: var(--green); }
.score.mid  .n { color: var(--label); }
.score.low  .n { color: var(--orange); }

/* Route chip: which fund, which vehicle, what cheque. The actual answer to
   "who do I send this to". */
.route {
  margin: var(--s5) 0 0;
  padding: var(--s4);
  border-radius: var(--r-control);
  background: color-mix(in srgb, var(--blue) 8%, transparent);
  border: 0.5px solid color-mix(in srgb, var(--blue) 22%, transparent);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px var(--s3);
}
.route-kicker {
  flex: none;
  font-size: var(--caption); line-height: var(--caption-lh);
  font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--blue);
}
.route .fund {
  font-size: var(--headline); line-height: var(--headline-lh); font-weight: 600;
}
.route .veh {
  font-size: var(--subhead); line-height: var(--subhead-lh); color: var(--label-2);
}

/* Company description leads when we have one. Absent means absent — a
   registry-only company is not described by inventing a SIC paraphrase. */
.blurb {
  margin: var(--s4) 0 0;
  font-size: var(--headline); line-height: var(--headline-lh);
  font-weight: 510; color: var(--label);
}

/* The spec's explanation, still verbatim — each template clause on its own
   line so a morning scan can pick Matches / Unknown / Route without
   reading a 280-character paragraph. Arithmetic stays in the sentence;
   we only break where `explain.py` already joined with ". ". */
.why {
  margin: var(--s4) 0 0;
  display: flex; flex-direction: column; gap: 6px;
  max-width: 40rem;
}
.why-clause {
  margin: 0;
  font-size: var(--subhead); line-height: var(--subhead-lh);
  color: var(--label-2);
}
.why-clause[data-kind="match"],
.why-clause[data-kind="found"] {
  color: var(--label);
}
.why-clause[data-kind="unknown"],
.why-clause[data-kind="against"],
.why-clause[data-kind="warn"] {
  color: var(--orange);
}
/* ───────────────────────────────────────────────────────── the ledger */

/* Why the scoring is a list and not the sentence it used to be.
   `score.explanation` is prose assembled from `components`, and the card was
   parsing that prose back into clauses to colour them — deriving structure
   from a string that had just been built out of structure. Aryan read
   "Against: sector (B2B SaaS). Unknown: traction signal." and had to work out
   which criteria existed at all, let alone which had failed. The components
   are in the payload already, so the row IS the criterion: one line per rule,
   status in the left column, the actual value on the right.

   Ten of these a morning is the design constraint. The icon column gives the
   eye a single rail to run down; nothing else is allowed to compete with it. */
.ledger { margin: var(--s5) 0 0; display: flex; flex-direction: column; gap: var(--s4); }

.led-group { display: flex; flex-direction: column; gap: var(--s1); }

.led-panels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
  gap: var(--s3);
}
.led-panel {
  min-width: 0;
  padding: var(--s4);
  background: var(--fill);
  border: 0.5px solid var(--separator);
  border-radius: var(--r-control);
}

.led-head {
  display: flex; align-items: baseline; gap: var(--s2);
  margin: 0 0 var(--s1);
}
.led-head h3 {
  margin: 0;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  font-weight: 590; letter-spacing: 0.01em;
  color: var(--label);
}
/* The group heading carries its own score, so the two numbers at the top of
   the card stop being unexplained. "Match 63" above the fit rules says what
   the 63 was counted from. */
.led-head .led-score {
  font-size: var(--footnote); line-height: var(--footnote-lh);
  font-weight: 590; font-variant-numeric: tabular-nums;
  color: var(--label-2);
}
.led-head .led-score b { color: var(--label); font-weight: 590; }

.led-rows { list-style: none; margin: 0; padding: 0; }

.led-row {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  gap: 2px var(--s3);
  align-items: baseline;
  padding: 5px 0;
  border-top: 0.5px solid var(--separator);
}
.led-row:first-child { border-top: 0; }

.led-ic {
  grid-row: 1;
  display: block; width: 16px; height: 16px;
  transform: translateY(2px);          /* optical baseline, not box baseline */
}
.led-row[data-status="met"]     .led-ic { color: var(--green); }
.led-row[data-status="partial"] .led-ic { color: var(--orange); }
.led-row[data-status="missed"]  .led-ic { color: var(--red); }
.led-row[data-status="unknown"] .led-ic { color: var(--label-2); }

.led-name {
  font-size: var(--subhead); line-height: var(--subhead-lh);
  color: var(--label); font-weight: 400;
}
.led-val {
  font-size: var(--subhead); line-height: var(--subhead-lh);
  color: var(--label-2); text-align: right;
}
/* `--label-3` is 0.30 alpha — about 1.7:1 on white. It is right for a
   progress dot and wrong for anything anyone has to read, so the unknown
   row keeps `--label-2` and lets the dashed mark carry the de-emphasis. */
.led-row[data-status="missed"] .led-val { color: var(--red); }

/* The sentence only appears where it earns its place: a met criterion needs
   no gloss ("Sector — Climate Tech" is self-evident), while an unknown or a
   miss is exactly where Aryan asked what the rule even means. */
.led-gloss {
  grid-column: 2 / -1; margin: 0;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  color: var(--label-2);
  max-width: 52ch;
}

.why-new-items {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 148px), 1fr));
  gap: 0.5px;
  margin: 0; padding: 0;
  background: var(--separator);
  border: 0.5px solid var(--separator);
  border-radius: var(--r-control);
  overflow: hidden;
}
.why-new-items .led-row {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  grid-template-areas:
    "icon name"
    "icon val"
    ".    gloss";
  gap: 2px var(--s2);
  padding: 10px var(--s4);
  border: 0;
  background: var(--bg-3);
}
.why-new-items .led-ic { grid-area: icon; transform: none; align-self: start; }
.why-new-items .led-name { grid-area: name; }
.why-new-items .led-val { grid-area: val; text-align: left; }
.why-new-items .led-gloss { grid-area: gloss; max-width: none; }

/* The original sentence, kept verbatim and one tap away. Nothing here
   paraphrases it; the ledger is the same data, not a retelling. */
.why-full { margin: var(--s4) 0 0; }
.why-full > summary {
  display: inline-flex; align-items: center; gap: 6px;
  list-style: none; cursor: pointer; width: fit-content;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  font-weight: 510; color: var(--blue);
  border-radius: var(--r-control);
}
.why-full > summary::-webkit-details-marker { display: none; }
.why-full > summary::after {
  content: ""; width: 7px; height: 7px; flex: none;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: translateY(-2px) rotate(45deg);
  transition: transform .25s var(--spring);
}
.why-full[open] > summary::after { transform: translateY(1px) rotate(-135deg); }
.why-full > summary:hover { text-decoration: underline; }
.why-full > summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.why-full .why { margin-top: var(--s2); }

@media (prefers-reduced-motion: reduce) {
  .why-full > summary::after { transition: none; }
}

.evidence { margin: var(--s4) 0 0; display: flex; flex-wrap: wrap; gap: var(--s2); }
.source-row {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--s2) var(--s3);
  width: 100%;
}
.source-caption {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 0;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  color: var(--label-2);
}
.source-ic { flex: none; color: var(--label-3); }
.ev {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px var(--s3);
  border-radius: 999px;
  background: var(--fill);
  color: var(--label); text-decoration: none;
  font-size: var(--footnote); line-height: var(--footnote-lh);
  transition: background .2s var(--spring), transform .2s var(--spring);
}
.ev:hover { background: color-mix(in srgb, var(--blue) 14%, var(--fill)); }
.ev:active { transform: scale(0.97); }
.ev .chev { color: var(--label-3); }

/* The way back to the source is the one link on this card worth pressing.
   Outlined, not filled: the filled control is the verdict, not the article. */
.ev.primary {
  background: transparent;
  color: var(--blue);
  font-weight: 590;
  border: 0.5px solid color-mix(in srgb, var(--blue) 55%, var(--separator));
}
.ev.primary:hover { background: color-mix(in srgb, var(--blue) 10%, transparent); }
.ev.primary .chev { color: var(--blue); }

.foot {
  margin-top: var(--s5); padding-top: var(--s4);
  border-top: 0.5px solid var(--separator);
  display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5);
  font-size: var(--footnote); line-height: var(--footnote-lh);
  color: var(--label-2);
}
/* Flags read as sentences, never as badges. A badge says "alert"; these are
   caveats on confidence. */
.flag { color: var(--orange); }
.also strong { color: var(--label); font-weight: 500; }

/* ─────────────────────────────────────────────────────── verdict bar */

footer {
  position: sticky; bottom: 0;
  padding: var(--s4) 0 var(--s6);
  background: var(--material);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  margin: var(--s6) calc(var(--s5) * -1) 0;
  padding-left: var(--s5); padding-right: var(--s5);
}
.actions { display: flex; gap: var(--s2); }
button {
  flex: 1;
  font-family: inherit;
  font-size: var(--headline); line-height: var(--headline-lh); font-weight: 500;
  padding: 13px var(--s4);
  border-radius: var(--r-control);
  border: 0.5px solid var(--separator);
  background: var(--bg-3); color: var(--label);
  cursor: pointer; white-space: nowrap;
  transition: transform .18s var(--spring), background .18s var(--spring);
}
button:hover { background: var(--fill); }
button:active { transform: scale(0.975); }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
button .kbd {
  font-size: var(--caption); color: var(--label-3); margin-left: 6px;
  font-variant-numeric: tabular-nums;
}
button.yes { background: var(--green); border-color: transparent; color: #fff; }
button.yes .kbd { color: rgba(255,255,255,0.7); }
button.no  { color: var(--red); }

/* The primary action was the least legible thing on the screen: white on the
   vivid system green measured 2.02:1 in dark mode and 2.22:1 in light. Light
   is fixed by the accessible green in tokens.css (5.19:1). Dark keeps its
   bright fill — dulling it would cost the green everywhere else it is used as
   a mark on a dark card — so the text inverts instead, which is what Apple
   does on bright fills anyway. Near-black on #30D158 is 10.4:1. */
@media (prefers-color-scheme: dark) {
  button.yes { color: #06210E; }
  button.yes .kbd { color: rgba(6,33,14,0.66); }
}

.hint {
  margin-top: var(--s3); text-align: center;
  font-size: var(--caption); line-height: var(--caption-lh); color: var(--label-3);
}

/* ─────────────────────────────────────────────────────────── states */

.empty, .done-state {
  text-align: center; padding: var(--s8) var(--s5);
  animation: rise .42s var(--spring) both;
}
.empty h2,
.done-state h2 { font-size: var(--title2); line-height: var(--title2-lh); }
.done-state .tick {
  font-size: 56px; line-height: 1; color: var(--green); margin-bottom: var(--s4);
}
.done-state p { color: var(--label-2); font-size: var(--subhead); }
.done-state a {
  color: var(--blue); text-decoration: none; font-weight: 500;
}
.done-state a:hover { text-decoration: underline; }
.done-state .review-again {
  display: inline-block; width: auto; margin-top: var(--s3);
  color: var(--blue); font-weight: 600;
}

.toast {
  position: fixed; left: 50%; bottom: var(--s8);
  transform: translateX(-50%) translateY(12px);
  background: var(--material);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 0.5px solid var(--separator);
  border-radius: 999px; padding: 10px var(--s5);
  font-size: var(--subhead); color: var(--label);
  opacity: 0; pointer-events: none;
  transition: opacity .3s var(--spring), transform .3s var(--spring);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

@media (max-width: 700px) {
  .app { padding: 0 var(--s4); }
  /* The bar bleeds to the edges with a negative margin that must mirror
     `.app`'s padding exactly. Leaving it at --s5 while the app drops to --s4
     made the footer 16px wider than the viewport and put a horizontal
     scrollbar on every phone. */
  footer {
    margin-left: calc(var(--s4) * -1); margin-right: calc(var(--s4) * -1);
    padding-left: var(--s4); padding-right: var(--s4);
  }
  header { padding: var(--s5) 0 var(--s4); }
  h1 { font-size: 28px; line-height: 34px; }
  .card { padding: var(--s5); }
  .hero { grid-template-columns: 1fr; gap: var(--s4); }
  .score-row { flex-direction: column; }
  .led-panels { grid-template-columns: 1fr; }
  .card h2 { font-size: 24px; line-height: 28px; }
  .score .n { font-size: 20px; line-height: 24px; }
  .blurb { font-size: var(--subhead); line-height: 21px; }
  .why-clause { font-size: var(--footnote); line-height: 18px; }
  button { font-size: var(--subhead); padding: 11px var(--s2); }
  .route { padding: var(--s3); margin-top: var(--s4); }
  .blurb, .why, .evidence { margin-top: var(--s4); }
}
@media (max-width: 460px) {
  header { flex-wrap: wrap; row-gap: var(--s2); }
  .dots { flex-basis: 100%; justify-content: flex-end; }
  .date { display: none; }             /* the header already says Today */
  button .kbd { display: none; }       /* no hardware keyboard to hint at */
}
</style>
</head>
<body>
<div class="app">
  <header data-testid="today-header">
    <h1 data-testid="today-title">Today</h1>
    <span class="date" id="date" data-testid="today-date"></span>
    <a class="help dashboard-link" href="/dashboard" data-testid="nav-dashboard" title="Calendar and kept history">Dashboard</a>
    <a class="help kept-link" href="/kept" data-testid="nav-kept" title="Companies you've kept">Kept<span class="kept-badge" id="kept-badge" data-testid="kept-badge" data-count="0"></span></a>
    <a class="help" href="/onboarding" data-testid="nav-onboarding" title="How this works">?</a>
    <div class="dots" id="dots" data-testid="progress" aria-hidden="true"></div>
  </header>

  <main id="main" data-testid="today-main" aria-live="polite"></main>

  <footer id="footer" data-testid="verdict-bar" hidden>
    <div class="actions" data-testid="verdict-actions">
      <button class="yes" data-v="worth contacting" data-testid="verdict-worth-contacting">Worth contacting<span class="kbd">1</span></button>
      <button data-v="unsure" data-testid="verdict-unsure">Unsure<span class="kbd">2</span></button>
      <button class="no" data-v="not for me" data-testid="verdict-not-for-me">Not for me<span class="kbd">3</span></button>
    </div>
    <div class="hint" data-testid="shortcut-hint">1 · 2 · 3 to decide &nbsp;·&nbsp; ← → to move &nbsp;·&nbsp; ⌘Z to undo</div>
  </footer>
</div>
<div class="toast" id="toast" data-testid="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
let data = null, i = 0, history = [], sessionReviewed = new Set();

const fmtMoney = (n) =>
  n == null ? null : "£" + (n >= 1e6 ? (n/1e6).toFixed(n % 1e6 ? 1 : 0) + "m"
                                     : Math.round(n/1000) + "k");

const band = (v, hi, lo) => v >= hi ? "high" : (v >= lo ? "mid" : "low");

const DISCOVERY = {
  news: "News",
  grant: "Grant",
  spinout: "University spinout",
  accelerator: "Accelerator",
  registry: "Companies House",
};

function prettyLabel(value) {
  const raw = String(value || "").replace(/_/g, " ").trim();
  if (!raw) return "";
  return raw.charAt(0).toUpperCase() + raw.slice(1);
}

function initial(name) {
  const t = String(name || "").trim();
  return t ? t[0].toUpperCase() : "";
}

const DOC_ICON = `<svg class="source-ic" viewBox="0 0 16 16" width="14" height="14"
     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
     aria-hidden="true"><path d="M4.5 2.5h5L12 5v8.5H4.5z"/><path d="M9.5 2.5V5H12"/></svg>`;

// Flags are the system's own words, turned into caveats a human reads.
const FLAG_COPY = {
  age_unknown: "incorporation date not confirmed",
  gate_unverified: "a fund rule could not be checked",
  uk_unverified: "UK presence not confirmed",
};

function evidenceLabel(sig) {
  const kind = (sig.kind || "").replace(/_/g, " ");
  return sig.headline ? sig.headline.slice(0, 52) : kind;
}

function sourceName(key) {
  return (key || "source").replace(/_/g, " ")
    .replace(/\b\w/g, ch => ch.toUpperCase());
}

// Split where `explain.py` joined with ". ", and only when the next clause
// opens with a known template prefix. A naive split would break on "Inc."
// inside a headline; this keeps each clause byte-identical to the join.
const EXPLAIN_CLAUSE =
  /(?<=\.) (?=(?:Found via |Matches on |Against: |Unknown: |Route to |Low visibility|Only \d|Rejected: |⚠ |age |eligibility |good fit))/;

function explanationClauses(text) {
  const raw = String(text || "").trim();
  return raw ? raw.split(EXPLAIN_CLAUSE).filter(Boolean) : [];
}

function explanationKind(clause) {
  if (clause.startsWith("Found via ")) return "found";
  if (clause.startsWith("Matches on ")) return "match";
  if (clause.startsWith("Against: ")) return "against";
  if (clause.startsWith("Unknown: ")) return "unknown";
  if (clause.startsWith("⚠ ") || clause.startsWith("age ") ||
      clause.startsWith("eligibility ") || clause.startsWith("Only ")) return "warn";
  return "note";
}

// A long shortlist morning should not force-read every clause. Keep the
// full sentence in the DOM (and in `data-text`) so D4 stays honest; only
// hide the tail until expanded.
// ─────────────────────────────────────────────────────────── the ledger

// Plain words for the scoring keys, and — where it is not obvious — a line
// saying what the rule is actually testing. `score.components` carries a
// `label`, but "Discovery route" and "Founder signal" are the engine's names
// for things, not a reader's, and the gloss is the part Aryan asked for: the
// rules were "too brief to understand".
//
// A gloss is only rendered when the criterion is NOT met, because that is
// where the question gets asked. "Sector — Climate Tech" explains itself.
const CRITERION = {
  sector:            {name: "Sector",          gloss: "What the company actually does."},
  geography:         {name: "Location",        gloss: "Where it is based. Most of these funds have a hard region rule, so an unknown here is worth a minute on the website."},
  stage:             {name: "Stage",           gloss: "How far along it is — idea, pre-seed, seed, growth."},
  founder_signal:    {name: "Founders",        gloss: "Whether they have built something before, or came out of a university or research lab."},
  traction_signal:   {name: "Traction",        gloss: "Any public sign of customers, revenue or usage."},
  press_coverage:    {name: "Press coverage",  gloss: "Articles in the sources we track. Less coverage is better here — it means fewer investors have seen it."},
  age:               {name: "Age",             gloss: "How long since it was incorporated. Without a Companies House match this stays unknown."},
  disclosed_funding: {name: "Money raised",    gloss: "Funding announced publicly. Nothing found either way, so this sits mid rather than assuming they are unfunded."},
  discovery_route:   {name: "How we found it", gloss: "A registry filing reaches you earlier than a news story does."},
};

// The four components that answer "has this fund already seen it?" — the
// rest answer "does it fit?". Splitting them lets each group sit under the
// score it produced, which is the only place Match and Fresh get defined
// where someone is actually looking.
const EDGE_KEYS = new Set(["press_coverage", "age", "disclosed_funding", "discovery_route"]);

// One drawn family: same 6.4r circle, same 1.75 stroke, differing only in the
// mark inside. Four states, because "we checked and it failed" and "we never
// found out" are different facts and the card must not blur them.
const LED_ICON = {
  met:     `<circle cx="8" cy="8" r="6.4"/><path d="M5.4 8.2l1.8 1.8 3.4-3.9"/>`,
  partial: `<circle cx="8" cy="8" r="6.4"/><path d="M8 1.6a6.4 6.4 0 0 1 0 12.8z" fill="currentColor" stroke="none"/>`,
  missed:  `<circle cx="8" cy="8" r="6.4"/><path d="M5.5 8h5"/>`,
  unknown: `<circle cx="8" cy="8" r="6.4" stroke-dasharray="2.1 2.5"/>`,
};

function ledIcon(status) {
  return `<svg class="led-ic" viewBox="0 0 16 16" width="16" height="16" fill="none"
               stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">${LED_ICON[status]}</svg>`;
}

// These two numbers are `POSITIVE_AT` and `NEGATIVE_AT` from
// radar/score/explain.py, and they are duplicated deliberately: the sentence
// in the <details> below calls a component a match at 0.6 and holds it
// "Against:" at 0.34, so any other threshold here would let the ledger and
// the sentence describe the same criterion two different ways on one card.
const LED_POSITIVE_AT = 0.6;
const LED_NEGATIVE_AT = 0.34;

// `sub_score` is null when nothing was found, which is not the same as zero.
// The full-model percentage keeps unknown criteria in its denominator, so the
// UI keeps the distinction: an unknown never renders as a guessed failure.
function ledStatus(component) {
  const s = component.sub_score;
  if (s === null || s === undefined) return "unknown";
  if (s >= LED_POSITIVE_AT) return "met";
  if (s <= LED_NEGATIVE_AT) return "missed";
  return "partial";
}

// Evidence strings are written for a log line, not a card. These rewrites
// change wording only where the engine's phrasing is machine-shaped; every
// value ("£350,000 disclosed", "Climate Tech") passes through untouched.
function ledValue(component, status) {
  const raw = String(component.evidence || "").trim();
  if (status === "unknown" || !raw || /^unknown$/i.test(raw)) return "not known";
  // "age unknown" / "funding unknown" arrive with a real sub_score — the
  // engine scores an undisclosed round at mid rather than nil — so they are
  // not `status === "unknown"`, but they still must not read as a value.
  if (/^age unknown$/i.test(raw)) return "not known";
  // Not "none disclosed": we did not check and find nothing, we never found
  // out. Saying "none" would be a claim the pipeline cannot support.
  if (/^funding unknown$/i.test(raw)) return "not known";
  if (/^0 tracked article\(s\)$/i.test(raw)) return "none yet";
  return raw.replace(/\btracked article\(s\)/i, "tracked articles");
}

function ledRows(components) {
  return components.map(comp => {
    const status = ledStatus(comp);
    const meta = CRITERION[comp.key] || {};
    const name = meta.name || comp.label || comp.key;
    const gloss = status !== "met" && meta.gloss
      ? `<p class="led-gloss">${esc(meta.gloss)}</p>` : "";
    return `<li class="led-row" data-testid="criterion"
                data-key="${esc(comp.key)}" data-status="${status}">
              ${ledIcon(status)}
              <span class="led-name">${esc(name)}</span>
              <span class="led-val">${esc(ledValue(comp, status))}</span>
              ${gloss}
            </li>`;
  }).join("");
}

function renderScoreFactors(components, keys) {
  const items = (Array.isArray(components) ? components : [])
    .filter(comp => keys.has(comp.key))
    .sort(ledSort)
    .slice(0, 4);
  if (!items.length) return "";
  return `<ul class="score-factors" data-testid="score-factors">${items.map(comp => {
    const status = ledStatus(comp);
    const meta = CRITERION[comp.key] || {};
    const name = meta.name || comp.label || comp.key;
    return `<li class="score-factor" data-testid="score-factor"
                data-key="${esc(comp.key)}" data-status="${status}">
              <span class="sf-name">${esc(name)}</span>
              <span class="sf-val">${esc(ledValue(comp, status))}</span>
            </li>`;
  }).join("")}</ul>`;
}

// Decided rules first, unknowns last: what we established outranks what we
// failed to. Within each, the heavier weight leads.
function ledSort(a, b) {
  const rank = s => (s === "unknown" ? 1 : 0);
  const d = rank(ledStatus(a)) - rank(ledStatus(b));
  return d || (Number(b.weight) || 0) - (Number(a.weight) || 0);
}

function renderCriteria(c) {
  const all = Array.isArray(c.components) ? c.components.filter(Boolean) : [];
  if (!all.length) return "";

  const fitItems = all.filter(x => !EDGE_KEYS.has(x.key)).sort(ledSort);
  const edgeItems = all.filter(x => EDGE_KEYS.has(x.key)).sort(ledSort);
  const groups = [];

  if (fitItems.length) {
    const matched = fitItems.filter(x => {
      const s = ledStatus(x);
      return s === "met" || s === "partial";
    });
    const against = fitItems.filter(x => ledStatus(x) === "missed");
    const missing = fitItems.filter(x => ledStatus(x) === "unknown");
    const score = `<span class="led-score">Match
            <b>${Math.round(Number(c.fit) || 0)}</b></span>`;
    let scoreUsed = false;
    const panel = (title, key, items) => {
      if (!items.length) return "";
      const headScore = scoreUsed ? "" : score;
      scoreUsed = true;
      return `
      <div class="led-panel" data-testid="criteria-panel" data-panel="${esc(key)}">
        <div class="led-head">
          <h3>${esc(title)}</h3>
          ${headScore}
        </div>
        <ul class="led-rows">${ledRows(items)}</ul>
      </div>`;
    };
    groups.push(`
      <section class="led-group" data-testid="criteria-group" data-group="fit">
        <div class="led-panels">${panel("Why it matches", "matched", matched)}${panel("Missing info", "missing", missing)}${panel("Against", "against", against)}</div>
      </section>`);
  }

  if (edgeItems.length) {
    groups.push(`
      <section class="led-group" data-testid="criteria-group" data-group="edge">
        <div class="led-head">
          <h3>Why it's new</h3>
          <span class="led-score">Fresh
            <b>${Math.round(Number(c.edge) || 0)}</b></span>
        </div>
        <ul class="led-rows why-new-items">${ledRows(edgeItems)}</ul>
      </section>`);
  }

  return `<div class="ledger" data-testid="criteria">${groups.join("")}</div>`;
}

const BREAKDOWN_FUNDS = [
  {key: "dsw", name: "DSW Ventures"},
  {key: "northstar", name: "Northstar Ventures"},
  {key: "outward", name: "Outward VC"},
  {key: "anticus", name: "Anticus Partners"},
];

function renderFundScores(c) {
  const byKey = {};
  for (const row of (c.fund_scores || [])) {
    if (row && row.fund_key) byKey[row.fund_key] = row;
  }
  const scores = BREAKDOWN_FUNDS.map(({key, name}) => {
    const row = byKey[key] || {};
    return {...row, fund_key: key, fund_name: name};
  });
  const also = (c.also_fits || []).length
    ? `<p class="fund-note" data-testid="also-fits">Also fits ${c.also_fits.slice(0,2).map(a =>
        `<strong>${esc(a.fund_key)}</strong> ${Math.round(a.fund_fit_pct)}`).join(" · ")}</p>`
    : "";
  return `<div class="fund-scores" data-testid="fund-scores" aria-label="Match score by fund">
    <div class="fund-scores-head">
      <h3>Match breakdown</h3>
      <p class="fund-scores-hint" data-testid="fund-scores-hint">The same four funds on every company. Each bar is this company against that fund's own rules — not a share of 100%. Send to mixes fund fit with how new it is, so the tallest bar is not always the route.</p>
    </div>
    ${scores.map(s => {
      const value = s.fit === null || s.fit === undefined ? null : Number(s.fit);
      const hasFit = Number.isFinite(value);
      const display = hasFit ? `${Math.round(value)}%` : "—";
      const coverage = s.coverage === null || s.coverage === undefined
        ? "" : ` · ${Math.round(Number(s.coverage) * 100)}% evidence`;
      const status = s.tier === "reject"
        ? ` · ${s.reject_reason || "not eligible"}` : "";
      const why = String(s.why || "").trim();
      const title = `${s.fund_name}: ${display} match${coverage}${status}${why ? " — " + why : ""}`;
      const tone = hasFit ? band(value, 70, 45) : "low";
      const best = s.fund_key === c.fund;
      const width = hasFit ? Math.max(0, Math.min(100, Math.round(value))) : 0;
      return `<div class="fund-score ${tone}${best ? " best" : ""}" data-testid="fund-score"
                   data-fund="${esc(s.fund_key)}"
                   data-value="${hasFit ? esc(s.fit) : ""}"
                   data-coverage="${s.coverage == null ? "" : esc(s.coverage)}"
                   data-tier="${esc(s.tier || "unscored")}"
                   title="${esc(title)}">
                 <div class="fund-score-top">
                   <div class="fund-score-name">
                     <div class="k">${esc(s.fund_name)}</div>
                     ${best ? `<span class="fund-tag">Send to</span>` : ""}
                   </div>
                   <div class="n">${display}</div>
                 </div>
                 <div class="fund-bar" aria-hidden="true">
                   <span class="fund-bar-fill" style="width:${width}%"></span>
                 </div>
                 ${why ? `<p class="fund-why" data-testid="fund-why">${esc(why)}</p>` : ""}
               </div>`;
    }).join("")}
    ${also}
  </div>`;
}

function renderEvidence(c) {
  const links = articleLinks(c).filter(a => safeUrl(a.url));
  if (!links.length) return "";
  const source = sourceName(c.source_key);
  const items = links.map((a, i) => {
    const primary = i === 0;
    const label = primary && a.kind === "source" ? `Open ${source}` : a.label;
    return `<a class="ev${primary ? " primary" : ""}" data-testid="evidence-link"
        data-kind="${esc(a.kind)}"${primary ? ' data-primary="true"' : ""}
        ${a.kind === "source" && primary ? 'data-primary-source="true"' : ""}
        ${primary ? 'aria-describedby="source-caption"' : ""}
        href="${safeUrl(a.url)}" target="_blank" rel="noopener">
       ${esc(label)} <span class="chev">↗</span></a>`;
  });
  const [primary, ...rest] = items;
  return `<div class="evidence" data-testid="evidence">
    <div class="source-row">
      <p class="source-caption" id="source-caption">${DOC_ICON}Source: ${esc(source)}</p>
      ${primary}
    </div>
    ${rest.join("")}
  </div>`;
}

function renderExplanation(text) {
  const raw = String(text || "").trim();
  const clauses = explanationClauses(raw);
  if (!clauses.length) {
    return `<div class="why" data-testid="explanation" data-text=""></div>`;
  }
  // No preview/"Show all" any more: the clauses live inside a <details> that
  // is shut by default, so collapsing them a second time hid text behind two
  // separate disclosures. The ledger above is the thing meant to be read.
  const items = clauses.map(clause =>
    `<p class="why-clause" data-testid="explanation-clause"
        data-kind="${explanationKind(clause)}">${esc(clause)}</p>`).join("");
  return `<div class="why" data-testid="explanation" data-text="${esc(raw)}"
               data-collapsed="false">${items}</div>`;
}

// Everything on this card is scraped off somebody else's website — a company
// name, an article headline, a URL out of an href. `render` builds one big
// innerHTML string, so any of it lands as markup unless it is escaped first.
// A source page with `<img src=x onerror=...>` in its <title> otherwise runs
// script here, and this page can read the whole queue and POST verdicts.
//
// Not theoretical: proved against a real headline before this was added.
function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Escaping is not enough for an href: `javascript:...` needs no angle bracket
// to run. `_common.absolute_url` drops that scheme, but only the HTML adapters
// go through it — the wp-json ones take `entry["link"]` as printed — so the
// allowlist belongs here too, at the point of use.
function safeUrl(value) {
  const raw = String(value ?? "").trim();
  try {
    const u = new URL(raw, location.origin);
    return (u.protocol === "http:" || u.protocol === "https:") ? esc(raw) : "";
  } catch { return ""; }
}

// Every way back to where this company came from, best label first.
//
// `signals` carry a headline, so they make the better button — the label IS
// the article. But a signal row only exists when the adapter emitted a
// recognised `kind_hint`, and most companies have none, which is why the card
// used to show no link at all. `sources` (from `company_source`) is written
// for every mention, so it is the fallback that guarantees a link whenever
// one exists. Registry companies legitimately have neither: Companies House
// is not an article, and inventing a link to it would be worse than no button.
function articleLinks(c) {
  const seen = new Set();
  const out = [];
  if (c.source_url && !seen.has(c.source_url)) {
    seen.add(c.source_url);
    out.push({
      url: c.source_url,
      label: `Found at ${sourceName(c.source_key)}`,
      kind: "source",
    });
  }
  for (const s of c.signals || []) {
    if (!s.source_url || seen.has(s.source_url)) continue;
    seen.add(s.source_url);
    out.push({ url: s.source_url, label: evidenceLabel(s), kind: s.kind || "" });
  }
  for (const s of c.sources || []) {
    if (!s.source_url || seen.has(s.source_url)) continue;
    seen.add(s.source_url);
    out.push({ url: s.source_url, label: sourceName(s.source_key), kind: "source" });
  }
  return out;
}

function renderKeptBadge(n) {
  const el = $("#kept-badge");
  if (!el) return;
  const count = Math.max(0, Number(n) || 0);
  el.dataset.count = String(count);
  el.textContent = count > 0 ? String(count) : "";
  el.hidden = count === 0;
}

function fmtCount(n) {
  return Math.max(0, Number(n) || 0).toLocaleString("en-GB");
}

function renderDiagnostics() {
  const d = data?.eligibility_diagnostics;
  if (!d) return "";

  const scored = Math.max(0, Number(d.scored_companies) || 0);
  const shown = Math.max(0, Number(d.shown) || 0);
  const excluded = Math.max(0, Number(d.excluded) || 0);
  const eligible = Math.max(0, Number(d.eligible_before_review) || 0);
  const reasons = Array.isArray(d.reasons)
    ? d.reasons.filter(r => r && Number(r.count) > 0) : [];
  const reasonRows = reasons.map(r => `
    <li class="diagnostic-reason" data-testid="eligibility-reason"
        data-reason="${esc(r.key)}">
      <span class="diagnostic-label">${esc(r.label)}</span>
      <span class="diagnostic-count">${fmtCount(r.count)}</span>
    </li>`).join("");
  const clear = `<p class="diagnostics-summary" data-testid="eligibility-clear">
    Every scored company that cleared the gates is in the queue.
  </p>`;

  return `<section class="diagnostics" data-testid="eligibility-diagnostics"
                   aria-labelledby="eligibility-title">
    <div class="diagnostics-head">
      <div>
        <p class="diagnostics-kicker">Queue diagnostics</p>
        <h2 id="eligibility-title">Why scored companies are not in Today</h2>
      </div>
      <span class="diagnostics-total" data-testid="eligibility-excluded">
        ${fmtCount(excluded)} excluded
      </span>
    </div>
    <p class="diagnostics-summary" data-testid="eligibility-summary">
      ${fmtCount(shown)} shown from ${fmtCount(scored)} scored; ${fmtCount(eligible)} cleared the gates before review state and the display limit.
      Counts use one first blocking reason per company. Names and source content stay private.
    </p>
    ${reasonRows ? `<ul class="diagnostics-reasons">${reasonRows}</ul>` : clear}
  </section>`;
}

function renderCompaniesHouseVerification(c) {
  const verified = c.ch_verified;
  if (!verified) return "";
  const date = verified.incorporated_on_display || verified.incorporated_on || "";
  const dateText = date
    ? `<span class="ch-verified-date" data-testid="ch-verified-date">Incorporated ${esc(date)}</span>`
    : `<span class="ch-verified-date" data-testid="ch-verified-date">incorporation date unavailable</span>`;
  return `<div class="ch-verified" data-testid="ch-verified"
                 data-incorporated-on="${esc(verified.incorporated_on || "")}">
            <span>Verified on Companies House</span>${dateText}
          </div>`;
}

function renderDone() {
  const main = $("#main"), footer = $("#footer");
  const pending = data?.companies || [];
  const kept = Number(data.totals?.kept) || 0;
  const reviewed = Number(data.totals?.reviewed_today) || pending.length;
  const keptLine = kept
    ? `<p><a href="/kept" data-testid="done-kept-link">${kept} kept</a> — open Kept any time to track them. Decisions are mirrored to the Google Sheet.</p>`
    : `<p>Nothing kept this round. Press <b>1</b> next time to save a company to <a href="/kept" data-testid="done-kept-link">Kept</a>.</p>`;
  main.innerHTML = `${renderDiagnostics()}<div class="done-state" data-testid="done-state"><div class="tick">✓</div>
    <h2>You've reviewed today's companies.</h2>
    <p>${reviewed} ${reviewed === 1 ? "company" : "companies"} reviewed today. Verdicts saved for the next tuning sweep.</p>
    ${keptLine}
    <button class="review-again" data-testid="review-again" type="button">Review Again</button></div>`;
  footer.hidden = true;
  renderDots();
}

function render() {
  const main = $("#main"), footer = $("#footer");
  if (!data) return;

  renderKeptBadge(data.totals?.kept);

  const pending = data.companies;
  if (!pending.length) {
    if (Number(data.totals?.reviewed_today) > 0) {
      renderDone(); return;
    }
    main.innerHTML = `${renderDiagnostics()}<div class="empty" data-testid="empty-state"><h2>Nothing to review</h2>
      <p style="color:var(--label-2)">No company cleared the gates in the last run.</p></div>`;
    footer.hidden = true; renderDots(); return;
  }
  if (i >= pending.length) {
    renderDone(); return;
  }

  const c = pending[i];
  const thin = c.coverage < 0.5;
  const cheque = c.cheque_min && c.cheque_max
    ? `${fmtMoney(c.cheque_min)}–${fmtMoney(c.cheque_max)}` : null;

  const metaBits = [];
  if (c.domain) metaBits.push(`<a data-testid="company-domain" href="${safeUrl(c.website || "https://" + c.domain)}" target="_blank" rel="noopener">${esc(c.domain)}</a>`);
  if (c.city) metaBits.push(`<span>${esc(c.city)}</span>`);
  else if (c.region) metaBits.push(`<span>${esc(prettyLabel(c.region))}</span>`);
  if (c.sector) metaBits.push(`<span>${esc(prettyLabel(c.sector))}</span>`);
  if (DISCOVERY[c.route]) metaBits.push(`<span>${esc(DISCOVERY[c.route])}</span>`);
  metaBits.push(`<span class="age" data-testid="company-age" data-exact="${esc(c.age_exact || "")}" ${c.age_exact ? `title="${esc(c.age_exact)}"` : ""}>${esc(c.age_phrase)}</span>`);

  // The explanation sentence already names its own caveats. Repeating them
  // below turns one warning into three, which reads as three problems.
  const said = (c.explanation || "").toLowerCase();
  const flags = (c.flags || [])
    .filter(f => !said.includes(f.replace(/_/g, " ")))
    .map(f => `<span class="flag" data-testid="caveat" data-flag="${esc(f)}">${esc(FLAG_COPY[f] || f.replace(/_/g, " "))}</span>`)
    .join("");

  const coverageNote = thin
    ? `<span class="flag" data-testid="coverage-note" data-coverage="${c.coverage}">we know ${Math.round(c.coverage * 5)} of 5 things about this company</span>` : "";
  const foot = [coverageNote, flags].filter(Boolean).join("");

  // Every hook a test needs is a data-testid. The CSS classes are for
  // styling and may be renamed freely; the testids are the contract.
  // `score-fit` / `score-edge` stay named (Match / Fresh in the label) so a
  // reordering can never silently assert Fresh against Match.
  const matchTitle = "Match — how strongly this company fits this fund's criteria. Unknown fields are skipped, never guessed.";
  const freshTitle = "Fresh — how likely it is the fund hasn't already seen this (age, tracked press, disclosed funding, discovery route). Unknown funding stays mid, not perfect.";
  const fundName = c.fund_name || c.fund || "this fund";
  const fitKeys = new Set((c.components || []).map(x => x.key).filter(k => !EDGE_KEYS.has(k)));
  main.innerHTML = `${renderDiagnostics()}
    <article class="card ${thin ? "thin" : ""}" data-testid="card"
             data-company-id="${esc(c.company_id)}" data-tier="${esc(c.tier)}"
             data-coverage="${esc(c.coverage)}" data-thin="${thin}">
      <div class="hero">
        <div class="ident">
          <div class="ident-head">
            <div class="mark" aria-hidden="true">${esc(initial(c.name))}</div>
            <h2 data-testid="company-name">${esc(c.name)}</h2>
            <div class="meta" data-testid="company-meta">${metaBits.join("")}</div>
          </div>
          ${renderCompaniesHouseVerification(c)}
          ${c.one_liner
            ? `<p class="blurb" data-testid="one-liner">${esc(c.one_liner)}</p>`
            : ""}
          ${renderEvidence(c)}
        </div>
        <div class="scores" data-testid="scores">
          <div class="score-row">
            <div class="score score-fit ${band(c.fit, 70, 45)}" data-testid="score-fit"
                 data-value="${c.fit}" data-band="${band(c.fit, 70, 45)}"
                 title="${esc(matchTitle)}">
              <div class="score-head">
                <div class="k" data-testid="score-label">Match</div>
                <div class="n" data-testid="score-value">${Math.round(c.fit)}</div>
              </div>
              <p class="score-def" data-testid="score-def-fit">Fund fit with ${esc(fundName)}</p>
              ${renderScoreFactors(c.components, fitKeys)}
            </div>
            <div class="score score-edge ${band(c.edge, 70, 45)}" data-testid="score-edge"
                 data-value="${c.edge}" data-band="${band(c.edge, 70, 45)}"
                 title="${esc(freshTitle)}">
              <div class="score-head">
                <div class="k" data-testid="score-label">Fresh</div>
                <div class="n" data-testid="score-value">${Math.round(c.edge)}</div>
              </div>
              <p class="score-def" data-testid="score-def-edge">How new it looks to them</p>
              ${renderScoreFactors(c.components, EDGE_KEYS)}
            </div>
          </div>
          <div class="score-hint" data-testid="score-hint">Match is fund fit for the Send to fund. Fresh is how new it looks to them.</div>
          ${renderFundScores(c)}
        </div>
      </div>

      <div class="route" data-testid="route" data-fund="${esc(c.fund)}">
        <span class="route-kicker">Send to</span>
        <div>
          <div class="fund" data-testid="route-fund">${esc(c.fund_name || c.fund)}</div>
          <div class="veh" data-testid="route-vehicle">${esc(c.vehicle || "")}${cheque ? " · " + cheque : ""}</div>
        </div>
      </div>

      ${renderCriteria(c)}

      <details class="why-full" data-testid="explanation-details">
        <summary data-testid="explanation-toggle">How this was scored, in full</summary>
        ${renderExplanation(c.explanation || "")}
      </details>

      ${foot ? `<div class="foot" data-testid="card-footnote">${foot}</div>` : ""}
    </article>`;

  footer.hidden = false;
  renderDots();
}

function renderDots() {
  const n = data?.companies?.length || 0;
  $("#dots").innerHTML = Array.from({length: Math.min(n, 12)}, (_, k) =>
    `<span class="dot ${k < i ? "done" : ""} ${k === i ? "now" : ""}"
            data-testid="progress-dot"
            data-state="${k < i ? "done" : (k === i ? "now" : "todo")}"></span>`).join("");
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1600);
}

async function decide(verdict) {
  const c = data.companies[i];
  if (!c) return;
  if (sessionReviewed.has(c.company_id)) return;
  sessionReviewed.add(c.company_id);
  history.push({ index: i, company_id: c.company_id });
  const res = await fetch("/api/verdict", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ company_id: c.company_id, verdict }),
  });
  if (!res.ok) {
    history.pop();
    sessionReviewed.delete(c.company_id);
    toast("Couldn't save that decision");
    return;
  }
  let kept = data.totals?.kept;
  let sheetSync = "unknown";
  try {
    const body = await res.json();
    if (typeof body.kept_count === "number") kept = body.kept_count;
    if (typeof body.sheet_sync === "string") sheetSync = body.sheet_sync;
  } catch { /* older servers still return {ok:true} only */ }
  c.verdict = verdict;
  if (data.totals) data.totals.kept = kept;
  renderKeptBadge(kept);
  if (verdict === "worth contacting" || verdict === "unsure") {
    const sheetNote = ["synced", "already_synced"].includes(sheetSync)
      ? " · Sheet synced" : " · Sheet sync pending";
    toast(`${c.name} — saved to Kept${sheetNote}`);
  } else {
    toast(`${c.name} — ${verdict}`);
  }
  i += 1;
  if (i >= data.companies.length) {
    await loadToday();
  } else {
    render();
  }
}

function undo() {
  const last = history.pop();
  if (!last) return;
  sessionReviewed.delete(last.company_id);
  i = last.index; render(); toast("Undone");
}

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); return undo(); }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "1") return decide("worth contacting");
  if (e.key === "2") return decide("unsure");
  if (e.key === "3") return decide("not for me");
  if (e.key === "ArrowRight") {
    if (i + 1 < (data?.companies?.length || 0)) { i += 1; render(); }
  }
  if (e.key === "ArrowLeft")  {
    const target = i - 1;
    if (target >= 0 && !sessionReviewed.has(data.companies[target].company_id)) {
      i = target; render();
    }
  }
});

document.addEventListener("click", (e) => {
  const again = e.target.closest("button[data-testid=\"review-again\"]");
  if (again) return reviewAgain();
  const b = e.target.closest("button[data-v]");
  if (b) decide(b.dataset.v);
});

async function loadToday() {
  data = await (await fetch("/api/today", {cache: "no-store"})).json();
  $("#date").textContent = new Date(data.date + "T00:00:00").toLocaleDateString("en-GB",
    { weekday: "long", day: "numeric", month: "long" });
  i = 0; history = []; sessionReviewed = new Set();
  render();
}

async function reviewAgain() {
  const res = await fetch("/api/review-again", {method: "POST"});
  if (!res.ok) {
    toast("Couldn't start the review again");
    return;
  }
  await loadToday();
  toast("Reviewing today's companies again");
}

loadToday();

// The daily run rewrites the score table in place, so a page left open would
// otherwise keep showing yesterday's shortlist forever. Poll cheaply and
// re-render only when the shortlist itself changed — mid-run counter flicker
// and untouched runs are no-ops, so a review in progress is never reset by
// a run that changed nothing.
function shortlistSig(p) {
  return (p?.companies || []).map(c =>
    `${c.company_id}|${Math.round(c.fit)}|${Math.round(c.edge)}|${c.tier}`).join(";");
}

async function refresh() {
  try {
    const next = await (await fetch("/api/today", {cache: "no-store"})).json();
    if (shortlistSig(next) === shortlistSig(data)) return;   // nothing new
    data = next;
    i = 0; history = []; sessionReviewed = new Set();
    render();
    toast("New run loaded — showing the latest shortlist");
  } catch (e) { /* transient db lock or network — retry next tick */ }
}

setInterval(refresh, 60_000);
</script>
</body>
</html>
